services:
  freshrss:
    build:
      context: .
      dockerfile: Docker/Dockerfile
    container_name: freshrss
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
    volumes:
      - freshrss_data:/var/www/FreshRSS/data
      - freshrss_extensions:/var/www/FreshRSS/extensions
    environment:
      CRON_MIN: 1,31
      TZ: Europe/Paris
    networks:
      - caddy_net

volumes:
  freshrss_data:
  freshrss_extensions:

networks:
  caddy_net:
    external: true
